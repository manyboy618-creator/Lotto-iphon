
name: Deploy LOTTO LAB iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unpack iPhone app
        run: |
          mkdir -p site
          unzip -q lotto_lab_v2_2_iphone_pwa.zip -d site
          test -f site/index.html
          touch site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
